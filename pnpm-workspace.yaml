packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  esbuild: true
  # next-demo's transitive sharp: its native build is only for production image
  # optimization — not needed by the harness, so keep the script off (and the
  # install prompt quiet).
  sharp: false

# Shared dependency versions, referenced from packages with "catalog:".
catalog:
  tsdown: ^0.22.12
  typescript: ^5.7.0
  vitest: ^4.1.12
  vite: ^6.0.0
  "@biomejs/biome": ^2.0.0
  react: ^18.3.1
  react-reconciler: ^0.29.2
  "@types/react": ^18.3.12

# Security floors for transitive dependencies a parent pins or locks below a
# patched release, where Dependabot can't lift them: next@15 pins postcss
# 8.4.31, postcss pulls nanoid 3 and source-map-js, changesets pulls js-yaml 3
# and 4, and fumadocs pulls zod.
overrides:
  "postcss@^8": ^8.5.26
  "nanoid@^3": ^3.3.18
  "source-map-js@^1": ^1.2.2
  "js-yaml@^3": ^3.15.2
  "js-yaml@^4": ^4.3.2
  "zod@^4": ^4.6.6

minimumReleaseAgeExclude:
  - tsdown@0.22.12
  - verkit@0.1.0
  - '@fumadocs/base-ui@16.14.0'
  - fumadocs-core@16.14.0
  - fumadocs-mdx@15.2.1
